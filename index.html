<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpapers HD</title> 
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f0f0; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* SECRET NOTIFICATIONS */
        #stealth-notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: white; padding: 12px 25px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: top 0.4s ease-in-out;
            z-index: 9999; font-weight: bold; font-size: 14px;
        }

        /* 1. HOME PAGE */
        #home-page { padding: 10px; background: #fff; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 15px; font-size: 20px; font-weight: bold; align-items: center; }
        .three-dots { cursor: pointer; padding: 5px 15px; font-size: 24px; font-weight: bold; }
        .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .wallpaper-item { width: 100%; height: 250px; background-color: #ddd; border-radius: 10px; background-size: cover; background-position: center; cursor: pointer; }

        /* 2. SECRET PAGE */
        #secret-page { background: #121212; color: white; min-height: 100vh; padding: 20px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        .new-friends-btn { background: #ff4757; color: white; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .profile-section { text-align: center; margin-bottom: 25px; }
        .profile-dp { width: 90px; height: 90px; border-radius: 50%; background: #444; margin: 0 auto 10px; border: 2px solid #4CAF50; cursor: pointer; }
        .username { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .cooldown-text { font-size: 11px; color: #888; margin-bottom: 15px; }
        .friends-logo { width: 45px; height: 45px; background: #4CAF50; border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; margin-bottom: 20px; background: #2a2a2a; color: white; }
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 12px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .dp-small { width: 45px; height: 45px; border-radius: 50%; background: #555; background-size: cover; }
        .add-btn { background: #4CAF50; color: white; border: none; padding: 6px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* 3. FRIENDS LIST */
        #friends-page { background: #000; color: white; min-height: 100vh; padding: 20px; }
        .my-name-header { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .dm-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; cursor: pointer; }

        /* 4. CHAT PAGE */
        #chat-page { display: flex; flex-direction: column; height: 100vh; background: #0b141a; color: white; }
        .chat-header { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .call-buttons span { margin-left: 20px; font-size: 22px; cursor: pointer; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: #0b141a; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 10px; position: relative; font-size: 15px; }
        .msg-received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg-sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .msg-info { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); }
        
        .dot-status { font-size: 12px; color: rgba(255,255,255,0.6); font-weight: bold; }
        .dot-status.green { color: #53bdeb; } 

        .secure-img { width: 100%; border-radius: 8px; margin-top: 5px; }
        .manual-download-btn { display: block; text-align: center; background: rgba(0,0,0,0.7); color: white; padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 12px; cursor: pointer; }

        .chat-footer { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .chat-input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; outline: none; background: #2a3942; color: white; }
        .custom-send-btn { width: 45px; height: 45px; border: none; cursor: pointer; background: linear-gradient(135deg, #8e44ad, #f39c12, #2ecc71); clip-path: polygon(0 0, 100% 50%, 0 100%, 25% 50%); }
    </style>
</head>
<body>

    <div id="stealth-notification">🖼️ New Wallpaper!</div>

    <!-- HOME PAGE -->
    <div id="home-page">
        <div class="header">
            <span>Wallpapers HD</span>
            <!-- THREE DOT MENU (No Popups now) -->
            <span class="three-dots" onclick="triggerSecretLogin()">⋮</span>
        </div>
        <div class="wallpaper-grid" id="wallpaper-grid"></div>
    </div>

    <!-- SECRET PAGE -->
    <div id="secret-page" class="hidden">
        <div class="top-nav">
            <span onclick="goHome()" style="cursor:pointer; font-size:20px;">🔙</span>
            <div class="new-friends-btn">New Friends 🔴</div>
        </div>
        <div class="profile-section">
            <div class="profile-dp"></div>
            <div class="username">Himanshu_8938 ✏️</div>
            <div class="cooldown-text">Next change available in 14 days</div>
            <div class="friends-logo" onclick="openFriendsList()">👥</div>
            <input type="text" class="search-bar" placeholder="Search users...">
        </div>
        <div class="user-list">
            <div class="user-item">
                <div class="user-info"><div class="dp-small"></div><span>Lalit Bariya</span></div>
                <button class="add-btn">Add</button>
            </div>
        </div>
    </div>

    <!-- FRIENDS LIST -->
    <div id="friends-page" class="hidden">
        <div class="top-nav"><span onclick="showPage('secret-page')" style="cursor:pointer; font-size:20px;">🔙</span></div>
        <div class="my-name-header">Himanshu_8938</div>
        <div class="user-list">
            <div class="dm-item" onclick="openChat('Lalit Bariya')">
                <div class="dp-small"></div><div class="dm-name">Lalit Bariya</div>
            </div>
        </div>
    </div>

    <!-- CHAT PAGE -->
    <div id="chat-page" class="hidden">
        <div class="chat-header">
            <div class="chat-header-info" onclick="showPage('friends-page')">
                <span>🔙</span><div class="dp-small" style="width:35px; height:35px;"></div><strong id="chat-user-name">User Name</strong>
            </div>
            <div class="call-buttons">
                <span onclick="showNotification('Audio')">📞</span>
                <span onclick="showNotification('Video')">📹</span>
            </div>
        </div>
        <div class="chat-body" id="chat-box">
            <div class="message msg-received">Bhai kya haal hai?<div class="msg-info"><span class="msg-time">10:30 PM</span></div></div>
        </div>
        <div class="chat-footer">
            <input type="text" id="msg-input" class="chat-input" placeholder="Message..." onkeypress="handleEnter(event)">
            <button class="custom-send-btn" onclick="sendMessage()"></button>
        </div>
    </div>

    <script>
        // DOM Load (Fixes the blank page issue)
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById('wallpaper-grid');
            // Changed link to Picsum so images load guaranteed
            for(let i=1; i<=24; i++) {
                grid.innerHTML += `<div class="wallpaper-item" style="background-image: url('https://picsum.photos/200/250?random=${i}')"></div>`;
            }
        });

        function showPage(pageId) {
            document.querySelectorAll('body > div').forEach(div => {
                if(div.id !== 'stealth-notification') div.classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }

        // SECRET LOGIN FIXED: No confirm() popups. Direct entry!
        function triggerSecretLogin() { showPage('secret-page'); }
        function goHome() { showPage('home-page'); }
        function openFriendsList() { showPage('friends-page'); }
        function openChat(name) {
            document.getElementById('chat-user-name').innerText = name;
            showPage('chat-page');
        }

        // SEND MESSAGE & DOT SYSTEM
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-sent';
            msgDiv.innerHTML = `${text}<div class="msg-info"><span class="msg-time">${time}</span><span class="dot-status">•</span></div>`;
            attachLongPress(msgDiv);
            document.getElementById('chat-box').appendChild(msgDiv);
            input.value = '';

            const dotSpan = msgDiv.querySelector('.dot-status');
            setTimeout(() => { dotSpan.innerHTML = '••'; }, 1000); 
            setTimeout(() => { dotSpan.classList.add('green'); }, 2500);
        }

        function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

        // LONG PRESS DELETE
        function attachLongPress(element) {
            let pressTimer;
            const startPress = () => { pressTimer = setTimeout(() => { element.remove(); }, 700); };
            const endPress = () => clearTimeout(pressTimer);
            element.addEventListener('mousedown', startPress);
            element.addEventListener('mouseup', endPress);
            element.addEventListener('mouseleave', endPress);
            element.addEventListener('touchstart', startPress);
            element.addEventListener('touchend', endPress);
        }

        // SECRET NOTIFICATIONS
        function showNotification(type) {
            const notif = document.getElementById('stealth-notification');
            if(type === 'Audio') notif.innerText = '🎵 New Audio Wallpaper!';
            else if(type === 'Video') notif.innerText = '🎬 New Video Wallpaper!';
            else notif.innerText = '🖼️ New Wallpaper!';
            notif.style.top = '20px';
            setTimeout(() => { notif.style.top = '-100px'; }, 3500);
        }
    </script>
</body>
</html>
