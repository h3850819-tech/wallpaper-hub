<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        
        /* आपका 3D सेंड बटन */
        .custom-send-btn {
            width: 65px; height: 45px;
            background: linear-gradient(90deg, #800080, #FFA500, #008000);
            clip-path: polygon(0 0, 25% 50%, 0 100%, 65% 80%, 65% 100%, 100% 50%, 65% 0, 65% 20%);
            box-shadow: inset 0px 4px 8px rgba(255, 255, 255, 0.4), 0px 4px 6px rgba(0,0,0,0.3);
            border: none; cursor: pointer; transition: transform 0.2s ease-in-out;
        }
        .custom-send-btn:active { transform: scale(0.90); }
        .secure-media { filter: blur(4px); transition: filter 0.3s; cursor: pointer; }
        .secure-media:hover { filter: blur(0px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ========================================== -->
    <!-- PHASE 1: HOME PAGE (24 WALLPAPERS)         -->
    <!-- ========================================== -->
    <div id="home-screen" class="min-h-screen p-4 block">
        <!-- 3-Dot Menu -->
        <div class="flex justify-end mb-2">
            <button onclick="showGoogleLogin()" class="text-3xl font-bold text-gray-400 hover:text-gray-700 px-2 pb-2">&#8942;</button>
        </div>
        
        <h1 class="text-center text-2xl font-bold mb-6 text-gray-800">Trending Wallpapers</h1>
        <!-- यहाँ पूरे 24 वॉलपेपर आएंगे -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="wallpaper-grid"></div>
    </div>

    <!-- Google Auth Modal (छलावा लॉगिन) -->
    <div id="google-login-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80 text-center">
            <h2 class="text-xl font-bold mb-4">Sign in</h2>
            <button onclick="loginWithGmail()" class="w-full flex items-center justify-center space-x-2 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <span>Sign in with Google (Gmail)</span>
            </button>
            <button onclick="hideGoogleLogin()" class="mt-4 text-gray-500 text-sm">Cancel</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PHASE 2: SECRET DASHBOARD (DP & USERNAME)  -->
    <!-- ========================================== -->
    <div id="dashboard-screen" class="min-h-screen bg-gray-900 text-white p-4 hidden">
        
        <div class="flex flex-col items-center mb-8 pt-4">
            <!-- DP Change Option (Click to open gallery) -->
            <label for="dp-upload" class="w-24 h-24 rounded-full bg-gray-700 mb-2 overflow-hidden border-2 border-purple-500 cursor-pointer relative group">
                <img id="user-dp" src="https://source.unsplash.com/random/100x100?face" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center text-xs">Change</div>
            </label>
            <input type="file" id="dp-upload" class="hidden" accept="image/*" onchange="changeDP(event)">
            
            <!-- Username Edit -->
            <input type="text" value="Himanshu_8938" class="text-center bg-transparent border-b border-gray-600 text-xl font-bold outline-none mb-1 focus:border-purple-500">
            <p class="text-[10px] text-gray-400">Username can only be changed once every 14 days.</p>
        </div>

        <input type="text" placeholder="Search users..." class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 outline-none mb-6">

        <h3 class="text-purple-400 font-semibold mb-3">New Friends</h3>
        <div class="flex items-center justify-between bg-gray-800 p-3 rounded-lg mb-6">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gray-600 rounded-full"></div>
                <span>Lalit Bariya</span>
            </div>
            <button class="bg-green-600 px-4 py-1 rounded-md text-sm font-bold">Accept</button>
        </div>

        <h3 class="text-orange-400 font-semibold mb-3">All Friends</h3>
        <div onclick="openChat()" class="flex items-center justify-between bg-gray-800 p-3 rounded-lg cursor-pointer hover:bg-gray-700">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gray-600 rounded-full"></div>
                <span>Vinit</span>
            </div>
            <span class="text-purple-400 text-sm font-bold">Tap to chat &rarr;</span>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PHASE 3: CHAT ROOM (3D BUTTON INCLUDED)    -->
    <!-- ========================================== -->
    <div id="chat-screen" class="flex-col h-screen bg-black text-white hidden">
        <!-- Chat Header -->
        <div class="flex justify-between items-center p-4 bg-gray-900 border-b border-gray-800">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="closeChat()">
                <span class="text-2xl font-bold text-gray-400">&larr;</span>
                <div class="w-10 h-10 bg-gray-700 rounded-full"></div>
                <h2 class="font-bold">Vinit</h2>
            </div>
            <div class="space-x-6 text-2xl flex">
                <button>📞</button>
                <button>📹</button>
            </div>
        </div>

        <div class="flex-1 p-4 overflow-y-auto">
            <div class="text-center text-xs text-gray-600 my-4">Today</div>
        </div>

        <!-- Bottom Input & 3D Send Button -->
        <div class="p-3 bg-gray-900 flex items-center space-x-3 w-full pb-6">
            <button class="text-2xl text-gray-400">📷</button>
            <button class="text-2xl text-gray-400">🖼️</button>
            <button class="text-2xl text-gray-400">🎤</button>
            <input type="text" placeholder="Type..." class="flex-1 px-4 py-2 rounded-full bg-gray-800 text-white outline-none">
            <button class="custom-send-btn flex-shrink-0"></button>
        </div>
    </div>

    <script>
        // 1. Generate 24 Wallpapers
        const grid = document.getElementById('wallpaper-grid');
        for (let i = 1; i <= 24; i++) {
            grid.innerHTML += `
                <div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-md">
                    <img src="https://source.unsplash.com/random/400x600?wallpaper,nature&sig=${i}" class="w-full h-56 object-cover">
                </div>
            `;
        }

        // 2. Google Login Flow
        function showGoogleLogin() {
            document.getElementById('google-login-modal').classList.replace('hidden', 'flex');
        }
        function hideGoogleLogin() {
            document.getElementById('google-login-modal').classList.replace('flex', 'hidden');
        }
        function loginWithGmail() {
            hideGoogleLogin();
            document.getElementById('home-screen').classList.replace('block', 'hidden');
            document.getElementById('dashboard-screen').classList.replace('hidden', 'block');
        }

        // 3. DP Change Logic
        function changeDP(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('user-dp').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Navigation
        function openChat() {
            document.getElementById('dashboard-screen').classList.replace('block', 'hidden');
            document.getElementById('chat-screen').classList.replace('hidden', 'flex');
        }
        function closeChat() {
            document.getElementById('chat-screen').classList.replace('flex', 'hidden');
            document.getElementById('dashboard-screen').classList.replace('hidden', 'block');
        }
    </script>
</body>
</html>
