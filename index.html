<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WallpaperHub - Free HD Wallpapers</title>
  
  <!-- Firebase SDKs (v9 Compat for clean single-file integration) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #1a1c23;
      --panel-bg: #15171e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #8b5cf6;
      --border-color: #2e323e;
      --sent-msg: #3b2d54;
      --recv-msg: #1e222d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      height: 100vh;
    }

    /* Quick Escape / Views */
    .view-layer {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .active-view {
      display: block;
    }

    /* 1. DISGUISE WALLPAPER HOME */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-radius: 6px;
    }

    .secret-trigger {
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 5px;
    }

    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 1.5rem;
      max-width: 1200px;
      margin: auto;
    }

    .wp-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      aspect-ratio: 9/16;
      border: 1px solid var(--border-color);
    }

    .wp-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 4 & 5. SECRET DASHBOARD / MEMBERS */
    .dashboard-container {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: auto;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    .sidebar {
      width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .user-profile-bar {
      padding: 15px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      cursor: pointer;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .profile-info {
      flex: 1;
      overflow: hidden;
    }

    .username-input-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .username-input-group input {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      width: 100%;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .username-input-group input:focus {
      border-color: var(--accent);
      outline: none;
      background: var(--bg-color);
    }

    .search-box {
      padding: 10px 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      outline: none;
    }

    .scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 10px 0 5px 5px;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .member-item:hover {
      border-color: var(--accent);
    }

    .member-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* 6 & 7. DM CHAT SYSTEM */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      height: 100%;
    }

    .chat-header {
      padding: 15px 20px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-actions {
      display: flex;
      gap: 15px;
    }

    .call-btn {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      position: relative;
      word-break: break-word;
      user-select: none;
    }

    .msg.sent {
      align-self: flex-end;
      background: var(--sent-msg);
      border-bottom-right-radius: 2px;
    }

    .msg.received {
      align-self: flex-start;
      background: var(--recv-msg);
      border-bottom-left-radius: 2px;
    }

    .msg-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 8. MESSAGE DOT STATUS */
    .dot-receipt {
      display: inline-flex;
      gap: 2px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .dot.green {
      background: #10b981;
    }

    /* 10. MEDIA DOWNLOAD OVERLAY */
    .chat-media-wrapper {
      position: relative;
      margin-top: 5px;
      border-radius: 8px;
      overflow: hidden;
      max-width: 250px;
    }

    .chat-media-wrapper img {
      width: 100%;
      display: block;
      pointer-events: none;
    }

    .media-dl-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* 11. PREMIUM 3D SEND BUTTON (Y-Shape Split Tail) */
    .chat-input-bar {
      padding: 12px 15px;
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border-color);
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 25px;
      color: #fff;
      outline: none;
    }

    .premium-send-btn {
      width: 42px;
      height: 42px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #f97316, #22c55e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.35), inset 0 2px 2px rgba(255, 255, 255, 0.4);
      transition: transform 0.1s ease;
    }

    .premium-send-btn:active {
      transform: scale(0.92);
    }

    .arrow-split-icon {
      width: 20px;
      height: 20px;
      fill: #fff;
      transform: translateX(1px);
    }

    /* 13. WEBRTC CALL OVERLAY */
    .call-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .video-streams {
      display: flex;
      width: 100%;
      height: 70%;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      background: #000;
      border-radius: 12px;
    }

    #remoteVideo {
      width: 80%;
      height: 90%;
      object-fit: cover;
    }

    #localVideo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 120px;
      height: 160px;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .call-controls {
      margin-top: 20px;
      display: flex;
      gap: 20px;
    }

    .btn-end-call {
      background: #ef4444;
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. DISGUISE WALLPAPER VIEW (DEFAULT STATE) -->
  <div id="view-disguise" class="view-layer active-view">
    <header>
      <div class="logo-container" onclick="openSecretDMList()">
        <div class="logo-icon"></div>
        <h2 style="font-size: 1.1rem; font-weight: 700;">WallpaperHub</h2>
      </div>
      <!-- Hidden Secret Login Trigger -->
      <div class="secret-trigger" onclick="handleSecretAuth()">⋮</div>
    </header>
    
    <main class="wallpaper-grid" id="wallpaperGrid"></main>
  </div>

  <!-- 4, 5, 6, 7. SECRET DASHBOARD / CHAT VIEW -->
  <div id="view-secret" class="view-layer">
    <div class="dashboard-container">
      
      <!-- Sidebar / Members & Profile -->
      <div class="sidebar">
        <div class="user-profile-bar">
          <div class="avatar-wrapper" onclick="triggerDPUpload()">
            <img id="myAvatar" class="avatar-img" src="https://via.placeholder.com/150" alt="Avatar">
            <input type="file" id="dpFileInput" style="display: none;" accept="image/*" onchange="uploadDP(event)">
          </div>
          <div class="profile-info">
            <div class="username-input-group">
              <input type="text" id="myUsername" onchange="updateUsername(this.value)" title="Press Enter to update">
              <span id="nameCooldownMsg" style="font-size: 0.65rem; color: #ef4444; display: none;">14d Cooldown</span>
            </div>
            <span style="font-size: 0.7rem; color: var(--text-muted);" id="myUserEmail"></span>
          </div>
          <button class="call-btn" onclick="quickEscape()" title="Instant Wallpaper Escape">🚪</button>
        </div>

        <div class="search-box">
          <input type="text" id="memberSearch" placeholder="Search members..." onkeyup="filterMembers(this.value)">
        </div>

        <div class="scroll-list">
          <div class="section-title">Friend Requests</div>
          <div id="requestsList"></div>

          <div class="section-title">Direct Messages</div>
          <div id="friendsList"></div>

          <div class="section-title">All Members</div>
          <div id="allMembersList"></div>
        </div>
      </div>

      <!-- Live Chat Pane -->
      <div class="chat-view">
        <div class="chat-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img id="activeChatAvatar" class="member-avatar" src="https://via.placeholder.com/150" alt="Chat User">
            <h4 id="activeChatName">Select a chat</h4>
          </div>
          <div class="chat-header-actions" id="callActions" style="display: none;">
            <button class="call-btn" onclick="startCall('audio')">📞</button>
            <button class="call-btn" onclick="startCall('video')">📹</button>
          </div>
        </div>

        <div class="messages-container" id="messagesBox"></div>

        <div class="chat-input-bar">
          <button class="call-btn" onclick="triggerChatMediaUpload()">📎</button>
          <input type="file" id="chatMediaInput" style="display: none;" accept="image/*" onchange="sendMediaMessage(event)">
          
          <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendTextMessage()">
          
          <!-- 11. Premium 3D Fish-Tail Send Button -->
          <button class="premium-send-btn" onclick="sendTextMessage()" title="Send">
            <svg class="arrow-split-icon" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2zM2 10l5 2-5 2z"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 13. WebRTC Call Overlay -->
  <div id="callModal" class="call-modal">
    <h3 id="callStatus" style="margin-bottom: 20px;">Calling...</h3>
    <div class="video-streams">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="btn-end-call" onclick="endCall()">End Call</button>
    </div>
  </div>

  <!-- CORE LOGIC INTEGRATION -->
  <script>
    /*************************************************************
     * FIREBASE CONFIGURATION (PASTE YOUR KEYS HERE)
     *************************************************************/
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Global State
    let currentUser = null;
    let userProfile = null;
    let activeChatUser = null;
    let unsubscribeMessages = null;
    let longPressTimer = null;

    // WebRTC Signaling State
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let currentCallId = null;

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    };

    /*************************************************************
     * 1. 24 DISGUISE WALLPAPERS INITIALIZATION
     *************************************************************/
    function loadWallpapers() {
      const grid = document.getElementById("wallpaperGrid");
      grid.innerHTML = "";
      for (let i = 1; i <= 24; i++) {
        const div = document.createElement("div");
        div.className = "wp-card";
        div.innerHTML = `<img src="https://picsum.photos/400/700?random=${i + 100}" alt="Wallpaper ${i}" loading="lazy">`;
        grid.appendChild(div);
      }
    }
    loadWallpapers();

    /*************************************************************
     * 3. QUICK ESCAPE & SESSION ISOLATION
     *************************************************************/
    // Critical: Reset to Wallpaper view on fresh page load or manual F5
    function quickEscape() {
      document.getElementById("view-secret").classList.remove("active-view");
      document.getElementById("view-disguise").classList.add("active-view");
      if (unsubscribeMessages) unsubscribeMessages();
      activeChatUser = null;
    }

    /*************************************************************
     * 2. SECRET LOGIN VIA 3-DOT ICON
     *************************************************************/
    async function handleSecretAuth() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;
        await syncUserProfile();
        openSecretDashboard();
      } catch (err) {
        console.error("Auth Fail", err);
      }
    }

    function openSecretDashboard() {
      document.getElementById("view-disguise").classList.remove("active-view");
      document.getElementById("view-secret").classList.add("active-view");
      listenToIncomingCalls();
      listenToRequests();
      listenToFriends();
      loadAllMembers();
    }

    function openSecretDMList() {
      if (currentUser) {
        openSecretDashboard();
      }
    }

    /*************************************************************
     * 4. PROFILE & 14-DAY USERNAME COOLDOWN
     *************************************************************/
    async function syncUserProfile() {
      const userRef = db.collection("users").doc(currentUser.uid);
      const doc = await userRef.get();

      if (!doc.exists) {
        userProfile = {
          uid: currentUser.uid,
          name: currentUser.displayName || "User",
          email: currentUser.email,
          photoURL: currentUser.photoURL || "https://via.placeholder.com/150",
          lastNameUpdate: null
        };
        await userRef.set(userProfile);
      } else {
        userProfile = doc.data();
      }

      document.getElementById("myAvatar").src = userProfile.photoURL;
      document.getElementById("myUsername").value = userProfile.name;
      document.getElementById("myUserEmail").innerText = userProfile.email;
    }

    async function updateUsername(newName) {
      if (!newName || newName === userProfile.name) return;

      const now = Date.now();
      const fourteenDays = 14 * 24 * 60 * 60 * 1000;

      if (userProfile.lastNameUpdate && (now - userProfile.lastNameUpdate.toMillis()) < fourteenDays) {
        document.getElementById("nameCooldownMsg").style.display = "inline";
        document.getElementById("myUsername").value = userProfile.name;
        return;
      }

      await db.collection("users").doc(currentUser.uid).update({
        name: newName,
        lastNameUpdate: firebase.firestore.FieldValue.serverTimestamp()
      });
      userProfile.name = newName;
      document.getElementById("nameCooldownMsg").style.display = "none";
    }

    function triggerDPUpload() {
      document.getElementById("dpFileInput").click();
    }

    async function uploadDP(event) {
      const file = event.target.files[0];
      if (!file) return;

      const storageRef = storage.ref(`avatars/${currentUser.uid}`);
      await storageRef.put(file);
      const downloadURL = await storageRef.getDownloadURL();

      await db.collection("users").doc(currentUser.uid).update({ photoURL: downloadURL });
      document.getElementById("myAvatar").src = downloadURL;
      userProfile.photoURL = downloadURL;
    }

    /*************************************************************
     * 5. FRIEND REQUEST SYSTEM & MEMBERS LIST
     *************************************************************/
    async function loadAllMembers() {
      const snapshot = await db.collection("users").get();
      const list = document.getElementById("allMembersList");
      list.innerHTML =
