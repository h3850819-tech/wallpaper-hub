<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpapers HD</title> <!-- Fake Title -->
    <style>
        /* =========================================
           GLOBAL CSS & VARIABLES
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f0f0; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* =========================================
           1. HOME PAGE (THE DISGUISE)
           ========================================= */
        #home-page { padding: 10px; background: #fff; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 15px; font-size: 20px; font-weight: bold; }
        .three-dots { cursor: pointer; padding: 5px 10px; font-size: 24px; }
        .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .wallpaper-item { width: 100%; height: 250px; background-color: #ddd; border-radius: 10px; background-size: cover; background-position: center; cursor: pointer; transition: transform 0.2s; }
        .wallpaper-item:active { transform: scale(0.95); }

        /* =========================================
           2. SECRET PAGE (PROFILE & MEMBERS)
           ========================================= */
        #secret-page { background: #121212; color: white; min-height: 100vh; padding: 20px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .new-friends-btn { background: #ff4757; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        
        .profile-section { text-align: center; margin-bottom: 30px; }
        .profile-dp { width: 100px; height: 100px; border-radius: 50%; background: #555; margin: 0 auto 10px; border: 3px solid #4CAF50; cursor: pointer; }
        .username { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .cooldown-text { font-size: 12px; color: #aaa; margin-bottom: 15px; }
        .friends-logo { width: 40px; height: 40px; background: #4CAF50; border-radius: 50%; margin: 10px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .search-bar { width: 100%; padding: 12px; border-radius: 25px; border: none; outline: none; margin-bottom: 20px; background: #222; color: white; }
        
        .user-list { margin-top: 20px; }
        .user-item { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-item .dp { width: 40px; height: 40px; border-radius: 50%; background: #777; }
        .add-btn { background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }

        /* =========================================
           3. PERSONAL CHAT PAGE
           ========================================= */
        #chat-page { display: flex; flex-direction: column; height: 100vh; background: #e5ddd5; }
        .chat-header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .call-buttons span { margin-left: 15px; font-size: 20px; cursor: pointer; }
        
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 15px; position: relative; user-select: none; transition: 0.3s; }
        .msg-received { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .msg-sent { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        
        .msg-time { font-size: 10px; color: #888; float: right; margin-top: 5px; margin-left: 10px; }
        
        /* 1. DOT SYSTEM (Single, Double, Green) */
        .status-dots { font-size: 12px; margin-left: 5px; color: #999; font-weight: bold; }
        .status-dots.read { color: #34b7f1; /* Green/Blue tick feel */ }

        /* 11. Secure Media Image */
        .secure-image { width: 100%; border-radius: 10px; margin-top: 5px; }
        .download-btn { display: block; text-align: center; background: rgba(0,0,0,0.6); color: white; padding: 5px; border-radius: 5px; text-decoration: none; margin-top: 5px; font-size: 12px; cursor: pointer; }

        /* 7. CUSTOM 3D GLOSSY SEND BUTTON (Y-Shape/Fish-tail) */
        .chat-footer { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .media-icons { display: flex; gap: 10px; font-size: 20px; color: #555; cursor: pointer; }
        
        .send-btn-custom {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, purple, orange, green);
            border: none;
            /* Fish-tail / Arrow Shape */
            clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%, 20% 50%);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }
        .send-btn-custom:active { transform: scale(0.9); }

        /* Fake Notification UI */
        #fake-notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 25px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: top 0.4s; z-index: 9999; font-weight: bold; }

    </style>
</head>
<body>

    <!-- Fake Notification Element -->
    <div id="fake-notification">🖼️ New Wallpaper Available!</div>

    <!-- =========================================
         HOME PAGE (WALLPAPERS)
         ========================================= -->
    <div id="home-page">
        <div class="header">
            <span>Wallpapers HD</span>
            <!-- 4. Secret Login Flow (3 Dots) -->
            <span class="three-dots" onclick="initiateSecretLogin()">⋮</span>
        </div>
        <div class="wallpaper-grid" id="wallpapers">
            <!-- Wallpapers injected via JS -->
        </div>
    </div>

    <!-- =========================================
         SECRET PAGE (PROFILE & MEMBERS)
         ========================================= -->
    <div id="secret-page" class="hidden">
        <div class="top-nav">
            <span onclick="goHome()" style="cursor:pointer;">🔙 Home</span>
            <!-- 4. New Friends Request -->
            <div class="new-friends-btn" onclick="alert('Friend Requests:\n1. Kuldeep [Accept]')">New Friends 🔴</div>
        </div>

        <div class="profile-section">
            <div class="profile-dp" title="Change DP"></div>
            <div class="username">Himanshu_8938</div>
            <div class="cooldown-text">Next username change in: 14 Days</div>
            
            <!-- 5 & 6. Friends List Logo -->
            <div class="friends-logo" onclick="openChat()" title="Friends List">👥</div>
            
            <input type="text" class="search-bar" placeholder="Search users...">
        </div>

        <h3>All Members</h3>
        <div class="user-list">
            <div class="user-item">
                <div class="user-info">
                    <div class="dp"></div> <span>Lalit Bariya</span>
                </div>
                <button class="add-btn">Add</button>
            </div>
            <div class="user-item">
                <div class="user-info">
                    <div class="dp"></div> <span>Vinit</span>
                </div>
                <button class="add-btn">Add</button>
            </div>
        </div>
    </div>

    <!-- =========================================
         PERSONAL CHAT PAGE
         ========================================= -->
    <div id="chat-page" class="hidden">
        <div class="chat-header">
            <div class="chat-header-info" onclick="closeChat()">
                <span>🔙</span>
                <div style="width:35px; height:35px; background:#fff; border-radius:50%;"></div>
                <strong>Lalit Bariya</strong>
            </div>
            <div class="call-buttons">
                <!-- 10. WebRTC Audio/Video Call Triggers -->
                <span onclick="startCall('audio')">📞</span>
                <span onclick="startCall('video')">📹</span>
            </div>
        </div>

        <div class="chat-body" id="chat-box">
            <div class="message msg-received">
                Bhai kaha hai?
                <span class="msg-time">10:25 PM</span>
            </div>
            
            <!-- 11. Secure Media View -->
            <div class="message msg-received">
                <img src="https://via.placeholder.com/150" class="secure-image">
                <a class="download-btn" onclick="secureDownload()">⬇️ Download manually</a>
                <span class="msg-time">10:26 PM</span>
            </div>

            <div class="message msg-sent">
                Ghar par hu.
                <span class="msg-time">10:28 PM <span class="status-dots read">✓✓</span></span>
            </div>
        </div>

        <div class="chat-footer">
            <div class="media-icons">
                <span>📷</span> <span>🖼️</span> <span>🎤</span>
            </div>
            <input type="text" id="msg-input" class="chat-input" placeholder="Type a message...">
            <!-- 7. CUSTOM 3D GLOSSY SEND BUTTON -->
            <button class="send-btn-custom" onclick="sendMessage()"></button>
        </div>
    </div>

    <script>
        /* =========================================
           8. PRIVACY & REFRESH FEATURE (QUICK ESCAPE)
           ========================================= */
        // If page is refreshed, it will ALWAYS load the home page.
        window.onload = function() {
            if(sessionStorage.getItem('isSecretRoute')) {
                // If you want to keep them logged in on refresh, remove this.
                // But as per feature 8: Refresh = Home Page
                sessionStorage.removeItem('isSecretRoute');
            }
            showPage('home-page');
            generateWallpapers();
        };

        function showPage(pageId) {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('secret-page').classList.add('hidden');
            document.getElementById('chat-page').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        /* 3. HOME PAGE WALLPAPERS (Lazy Load logic can be added here) */
        function generateWallpapers() {
            const grid = document.getElementById('wallpapers');
            grid.innerHTML = '';
            for(let i=1; i<=24; i++) {
                let div = document.createElement('div');
                div.className = 'wallpaper-item';
                div.style.backgroundImage = `url('https://source.unsplash.com/random/200x250?wallpaper&sig=${i}')`;
                div.onclick = () => alert('Opening Full Screen Wallpaper...');
                grid.appendChild(div);
            }
        }

        /* 4. SECRET LOGIN FLOW */
        function initiateSecretLogin() {
            // Placeholder for Firebase Google Auth: 
            // firebase.auth().signInWithPopup(provider).then(...)
            let pass = confirm("Fake Google Sign-in Prompt. Proceed to Secret Page?");
            if(pass) {
                sessionStorage.setItem('isSecretRoute', 'true');
                showPage('secret-page');
            }
        }

        function goHome() { showPage('home-page'); }
        function openChat() { showPage('chat-page'); }
        function closeChat() { showPage('secret-page'); }

        /* 12. DIRECT LIVE CHAT & DOT SYSTEM */
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value;
            if(!msg) return;

            const chatBox = document.getElementById('chat-box');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Create Message Element
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message msg-sent';
            
            // 1. Dot System implementation
            msgDiv.innerHTML = `${msg} <span class="msg-time">${time} <span class="status-dots">✓</span></span>`;
            
            // 13. Long Press to Delete logic setup
            setupLongPress(msgDiv);

            chatBox.appendChild(msgDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulate Network flow for Dots (Single -> Double -> Green)
            const dots = msgDiv.querySelector('.status-dots');
            setTimeout(() => { dots.innerHTML = '✓✓'; }, 1000); // Delivered
            setTimeout(() => { dots.innerHTML = '✓✓'; dots.classList.add('read'); }, 3000); // Read/Seen
            
            // 9. Stealth Notification simulation (reply from other user)
            setTimeout(triggerFakeNotification, 4000);
        }

        /* 13. LONG PRESS TO DELETE (Delete for Everyone) */
        function setupLongPress(element) {
            let pressTimer;
            
            element.addEventListener('mousedown', (e) => {
                pressTimer = setTimeout(() => {
                    if(confirm('Delete this message for everyone?')) {
                        // Firebase logic: firestore.collection('chats').doc(id).delete()
                        element.remove(); 
                    }
                }, 800); // 800ms long press
            });
            
            element.addEventListener('mouseup', () => clearTimeout(pressTimer));
            element.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            
            // For Mobile Touch
            element.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => {
                    if(confirm('Delete this message for everyone?')) { element.remove(); }
                }, 800);
            });
            element.addEventListener('touchend', () => clearTimeout(pressTimer));
        }

        // Attach long press to existing messages
        document.querySelectorAll('.message').forEach(setupLongPress);

        /* 9. SECRET NOTIFICATIONS */
        function triggerFakeNotification(type = 'msg') {
            const notif = document.getElementById('fake-notification');
            if(type === 'audio') notif.innerHTML = '🎵 New Audio Wallpaper!';
            else if(type === 'video') notif.innerHTML = '🎬 New Video Wallpaper!';
            else notif.innerHTML = '🖼️ New Wallpaper Available!';

            notif.style.top = '20px';
            setTimeout(() => { notif.style.top = '-100px'; }, 3000);
        }

        /* 10. WebRTC CALLING PLACEHOLDER */
        function startCall(type) {
            triggerFakeNotification(type); // Triggers notification on other device
            alert(`Initiating WebRTC ${type} Call...\n(Requires Firebase signaling and getUserMedia API)`);
        }

        /* 11. SECURE MEDIA DOWNLOAD */
        function secureDownload() {
            // In real app, convert Blob URL to base64 or trigger HTML5 download
            alert('File downloaded to main gallery safely!');
        }

    </script>
</body>
</html>
