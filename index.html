<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BerylWalls & Secure Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f15; color: #ffffff; padding-bottom: 30px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #161622; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        header h1 { font-size: 20px; color: #ff3366; letter-spacing: 1px; }
        .menu-container { position: relative; }
        .three-dot-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px 10px; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 45px; background-color: #1e1e2f; border-radius: 8px; min-width: 170px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); overflow: hidden; z-index: 1000; border: 1px solid #2b2b40; }
        .dropdown-menu button { width: 100%; background: none; border: none; color: white; padding: 12px 15px; text-align: left; font-size: 14px; cursor: pointer; }
        .dropdown-menu button:hover { background-color: #2b2b40; color: #00e6e6; }
        
        /* 24 Wallpapers Grid */
        .category-container { margin: 25px 15px; }
        .category-title { font-size: 18px; color: #00e6e6; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .wallpaper-card { background-color: #161622; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; }
        .wallpaper-card img { width: 100%; height: 190px; object-fit: cover; display: block; }
        
        #wallpaperViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        #wallpaperViewer img { max-width: 90%; max-height: 80%; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.8); }
        .close-viewer { margin-top: 20px; background: #ff3366; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* Auth Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 1500; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background-color: #1e1e2f; padding: 30px 25px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; border: 1px solid #2b2b40; }
        .auth-box h2 { font-size: 22px; margin-bottom: 10px; color: #ff3366; }
        .auth-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff3366, #ff6633); border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Dashboard */
        #chat-dashboard { display: none; max-width: 500px; margin: 0 auto; min-height: 100vh; flex-direction: column; background-color: #0f0f15; border-left: 1px solid #2b2b40; border-right: 1px solid #2b2b40; position: relative;}
        .chat-header { background-color: #161622; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b2b40; position: sticky; top: 0; z-index: 10; }
        .profile-section { text-align: center; padding: 25px 20px 15px; }
        .profile-pic { width: 90px; height: 90px; background-color: #1e1e2f; border-radius: 50%; margin: 0 auto 15px; display: block; object-fit: cover; border: 2px solid #ff3366; cursor: pointer; }
        .change-dp-btn { background-color: #1e1e2f; color: #00e6e6; border: 1px solid #3b3b54; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .username-display { margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .username-display input { background: #11111a; border: 1px solid #3b3b54; border-radius: 6px; padding: 8px 10px; color: #00e6e6; font-size: 15px; font-weight: bold; text-align: center; width: 150px; outline: none; }
        #saveUserBtn { background: #00e6e6; color: #0f0f15; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .search-container { padding: 0 20px 15px; }
        .search-bar { width: 100%; padding: 10px 14px; border: 1px solid #3b3b54; border-radius: 10px; background-color: #1e1e2f; color: white; font-size: 14px; outline: none; }

        .list-section { padding: 0 20px 20px; }
        .section-title-chat { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #2b2b40; padding-bottom: 5px;}
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e1e2f; }
        .user-info { display: flex; align-items: center; cursor: pointer; flex: 1; }
        .user-avatar { width: 45px; height: 45px; background-color: #3b3b54; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .user-name { font-weight: bold; font-size: 15px; color: #fff; margin:0;}
        .btn-add { background-color: #00e6e6; color: #0f0f15; border: none; padding: 7px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .badge { background: #28a745; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold; margin-left: 8px; }

        /* Private Chat Room */
        #private-chat-room { display: none; flex-direction: column; height: 100vh; background-color: #0f0f15; }
        .chat-room-header { background-color: #161622; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2b2b40; }
        .chat-room-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; color: #00e6e6; font-size: 20px; cursor: pointer; }
        .call-icons { display: flex; gap: 15px; font-size: 20px; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .message.incoming { background-color: #1e1e2f; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.outgoing { background: linear-gradient(45deg, #00e6e6, #00b3b3); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; cursor: pointer; }
        .msg-info { font-size: 10px; margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; opacity: 0.8; }
        
        .chat-input-area { padding: 12px 15px; background-color: #161622; display: flex; align-items: center; gap: 10px; border-top: 1px solid #2b2b40; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #1e1e2f; border: 1px solid #3b3b54; border-radius: 20px; color: white; outline: none; }
        .action-icon-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 5px; }
        
        /* WhatsApp / Instagram Style Paper-Plane Send Button */
        .send-btn { width: 45px; height: 45px; background-color: #00e6e6; border: none; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Calling Screen */
        #calling-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f15; z-index: 3000; flex-direction: column; justify-content: space-between; padding: 20px; text-align: center; }
        .call-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3001; display: flex; justify-content: center; align-items: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; bottom: 100px; right: 20px; width: 110px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid #ff3366; z-index: 3005; }
        .call-top-bar { display: flex; justify-content: space-between; align-items: center; z-index: 3005; }
        .call-center-info { position: relative; z-index: 3005; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 40px; }
        .call-dp { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #ff3366; object-fit: cover; }
        .call-controls { position: relative; z-index: 3005; display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .call-btn { width: 55px; height: 55px; border-radius: 50%; border: none; background: #1e1e2f; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .call-btn.end-call { background: #ff3366; width: 65px; height: 65px; }

        #incomingCallModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; justify-content: center; align-items: center; }
        .incoming-box { background: #1e1e2f; padding: 30px; border-radius: 16px; text-align: center; border: 1px solid #ff3366; width: 300px; }
    </style>
</head>
<body>

    <!-- 24 WALLPAPERS HUB -->
    <div id="main-website">
        <header>
            <h1>🌟 BerylWalls Hub</h1>
            <div class="menu-container">
                <button class="three-dot-btn" onclick="toggleMenu(event)">⋮</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button onclick="openModal('loginModal')">🔒 Private Chat Login</button>
                </div>
            </div>
        </header>

        <div class="category-container">
            <div class="category-title">🏎️ Supercars & Bikes (12)</div>
            <div class="wallpaper-grid" id="carGrid"></div>
        </div>
        <div class="category-container">
            <div class="category-title">🌿 Nature & Scenery (12)</div>
            <div class="wallpaper-grid" id="natureGrid"></div>
        </div>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="wallpaperViewer">
        <img id="viewerImg" src="">
        <button class="close-viewer" onclick="closeViewer()">Close View</button>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="auth-box">
            <h2>Secure Login</h2>
            <button class="auth-btn" style="background:#4285F4;" id="googleLoginBtn">🌐 Login with Google</button>
            <button class="close-btn" onclick="closeAllModals()" style="background:none; border:none; color:#aaa; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <!-- MESSENGER DASHBOARD -->
    <div id="chat-dashboard">
        <div id="messenger-home">
            <div class="chat-header">
                <h2 style="color:white;">BerylWalls Messenger</h2>
                <button class="close-btn" id="logoutBtn" style="background:none; border:none; color:#ff3366; font-weight:bold; cursor:pointer;">Logout</button>
            </div>
            
            <div class="profile-section">
                <input type="file" id="dpUploader" style="display:none;" accept="image/*">
                <img src="https://via.placeholder.com/100" class="profile-pic" id="myProfilePic" onclick="document.getElementById('dpUploader').click()">
                <button class="change-dp-btn" onclick="document.getElementById('dpUploader').click()">📷 Change DP</button>
                <div class="username-display">
                    <input type="text" placeholder="Username" id="myUsername" maxlength="15"> 
                    <button id="saveUserBtn">Save</button>
                </div>
            </div>

            <!-- SEARCH BAR & ALL MEMBERS -->
            <div class="search-container">
                <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Search member..." oninput="filterMembers()">
            </div>
            <div class="list-section">
                <div class="section-title-chat">👥 All Platform Members</div>
                <div id="all-members-list"></div>
            </div>

            <div class="list-section" id="requests-received-section" style="display:none;">
                <div class="section-title-chat">🔔 Friend Requests</div>
                <div id="requests-received-list"></div>
            </div>

            <div class="list-section">
                <div class="section-title-chat">💬 Active Chats</div>
                <div id="friends-list"></div>
            </div>
        </div>

        <!-- PRIVATE CHAT ROOM -->
        <div id="private-chat-room">
            <div class="chat-room-header">
                <div class="chat-room-header-left">
                    <button class="back-btn" onclick="closePrivateChat()">←</button>
                    <h3 style="font-size: 16px; color: white;" id="chattingWithName">Friend</h3>
                </div>
                <div class="call-icons">
                    <span onclick="window.startCall('audio')">📞</span>
                    <span onclick="window.startCall('video')">📹</span>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-area">
                <button class="action-icon-btn" onclick="alert('Voice Note')">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button class="action-icon-btn" onclick="document.getElementById('imageUploader').click()">📎</button>
                <input type="file" id="imageUploader" style="display:none;" accept="image/*" onchange="sendImageMessage(this)">
                
                <!-- WhatsApp/Instagram Style Paper Plane Send Button -->
                <button class="send-btn" onclick="window.sendMessage()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="#0f0f15">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- WEBRTC CALLING SCREEN -->
    <div id="calling-screen">
        <div class="call-video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-top-bar">
            <button class="close-btn" onclick="window.flipCamera()" style="background:#333; padding:8px 12px; border-radius:5px; color:white; border:none; cursor:pointer;">🔄 Flip Cam</button>
        </div>
        <div class="call-center-info">
            <img src="https://via.placeholder.com/100" id="callTargetPic" class="call-dp">
            <h2 id="callTargetName" style="font-size:22px; color:white;">Calling...</h2>
        </div>
        <div class="call-controls">
            <button class="call-btn" onclick="window.toggleMute()">🎤</button>
            <button class="call-btn" onclick="window.toggleSpeaker()">🔊</button>
            <button class="call-btn end-call" onclick="window.endCall()">🔴</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incomingCallModal">
        <div class="incoming-box">
            <h3 style="color:#00e6e6; margin-bottom:15px;" id="incomingCallTitle">Incoming Call...</h3>
            <button style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:20px; margin-right:10px; cursor:pointer;" onclick="window.acceptIncomingCall()">Accept</button>
            <button style="background:#dc3545; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;" onclick="window.rejectIncomingCall()">Reject</button>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // Populate 24 Wallpapers (12 Cars + 12 Nature)
        const cars = [
            "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=800", "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800",
            "https://images.unsplash.com/photo-1503376269666-41f274a49c95?w=800", "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=800",
            "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=800", "https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?w=800",
            "https://images.unsplash.com/photo-1502877338535-766e1452684a?w=800", "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800",
            "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=800", "https://images.unsplash.com/photo-1525609004556-c46c7d6cf023?w=800",
            "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800", "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800"
        ];
        const nature = [
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800", "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800",
            "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=800", "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=800",
            "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800", "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800",
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800", "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800", "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800", "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
        ];

        function loadWallpapers() {
            const cEl = document.getElementById('carGrid');
            const nEl = document.getElementById('natureGrid');
            cars.forEach(url => cEl.innerHTML += `<div class="wallpaper-card" onclick="openViewer('${url}')"><img src="${url}" loading="lazy"></div>`);
            nature.forEach(url => nEl.innerHTML += `<div class="wallpaper-card" onclick="openViewer('${url}')"><img src="${url}" loading="lazy"></div>`);
        }
        loadWallpapers();

        function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
        document.addEventListener('click', () => { document.getElementById('dropdownMenu').style.display = 'none'; });
        function openViewer(url) { document.getElementById('viewerImg').src = url; document.getElementById('wallpaperViewer').style.display = 'flex'; }
        function closeViewer() { document.getElementById('wallpaperViewer').style.display = 'none'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none'); }
        function showDashboard() { closeAllModals(); document.getElementById('main-website').style.display = 'none'; document.getElementById('chat-dashboard').style.display = 'flex'; document.getElementById('messenger-home').style.display = 'block'; }
        function closePrivateChat() { document.get
