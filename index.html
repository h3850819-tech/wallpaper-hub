<script type="module">
    // 1. स्मार्ट हैक: बिना पुराना कोड छेड़े WebRTC कनेक्शन को पकड़ना
    window.activeWebRTC26 = null;
    const origOffer = RTCPeerConnection.prototype.createOffer;
    const origAnswer = RTCPeerConnection.prototype.createAnswer;
    RTCPeerConnection.prototype.createOffer = function() { window.activeWebRTC26 = this; return origOffer.apply(this, arguments); };
    RTCPeerConnection.prototype.createAnswer = function() { window.activeWebRTC26 = this; return origAnswer.apply(this, arguments); };

    let currentFacingMode = 'user'; // डिफ़ॉल्ट फ्रंट कैमरा

    setTimeout(() => {
        const localVid = document.getElementById('localVideo22');
        const remoteVid = document.getElementById('remoteVideo22');

        // ==========================================
        // फीचर 1: वीडियो स्क्रीन स्वैप (छोटी को बड़ी, बड़ी को छोटी करना)
        // ==========================================
        if (localVid && remoteVid) {
            let isLocalSmall = true;

            const toggleVideoSwap = () => {
                // चेक करें कि वीडियो कॉल चल भी रही है या नहीं (ऑडियो कॉल में स्वैप नहीं होगा)
                if (localVid.style.display === 'none') return;

                isLocalSmall = !isLocalSmall;
                if (isLocalSmall) {
                    // वापस नार्मल (लोकल छोटा, रिमोट बड़ा)
                    remoteVid.style.cssText = "width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:1; display:block; cursor:default; border:none; border-radius:0;";
                    localVid.style.cssText = "width:110px; height:160px; object-fit:cover; position:absolute; top:40px; right:20px; border-radius:12px; border:2px solid white; display:block; box-shadow:0 4px 10px rgba(0,0,0,0.5); z-index:2; background:#333; cursor:pointer;";
                } else {
                    // स्वैप (लोकल बड़ा, रिमोट छोटा)
                    localVid.style.cssText = "width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:1; display:block; background:#333; cursor:default; border:none; border-radius:0;";
                    remoteVid.style.cssText = "width:110px; height:160px; object-fit:cover; position:absolute; top:40px; right:20px; border-radius:12px; border:2px solid white; display:block; box-shadow:0 4px 10px rgba(0,0,0,0.5); z-index:2; cursor:pointer;";
                }
            };

            // क्लिक इवेंट्स: जो स्क्रीन छोटी है, उसी पर क्लिक करने से स्वैप होगा
            localVid.addEventListener('click', () => { if (isLocalSmall) toggleVideoSwap(); });
            remoteVid.addEventListener('click', () => { if (!isLocalSmall) toggleVideoSwap(); });
        }

        // ==========================================
        // फीचर 2: Contacts बटन की जगह असली Flip Camera लगाना
        // ==========================================
        const icons = document.querySelectorAll('.ios-icon-btn');
        if (icons.length >= 6) {
            const flipBtn = icons[5]; // छठा बटन (पहले Contacts था)
            
            // बटन का रूप बदलना
            flipBtn.innerHTML = `
                <div class="ios-icon-circle" id="flipCircle26" style="transition:0.3s;">
                    <svg width="26" height="26" fill="white" viewBox="0 0 24 24">
                        <path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3v-2c2.76 0 5 2.24 5 5s-2.24 5-5 5zm4.5-9H12V7l-4 4 4 4v-2h4.5v-4z"/>
                    </svg>
                </div>
                <span class="ios-icon-text">flip</span>
            `;

            // कैमरा पलटने का जादू (Logic)
            flipBtn.onclick = async () => {
                // अगर वीडियो कॉल नहीं है, तो मना कर देगा
                if (!localVid || localVid.style.display === 'none' || !localVid.srcObject) {
                    alert("Flip camera only works during a Video Call!");
                    return;
                }
                
                // बटन पर टच इफ़ेक्ट
                const circle = document.getElementById('flipCircle26');
                const svg = document.querySelector('#flipCircle26 svg');
                circle.style.background = 'white';
                svg.style.fill = 'black';
                setTimeout(() => {
                    circle.style.background = 'rgba(255, 255, 255, 0.15)';
                    svg.style.fill = 'white';
                }, 200);

                // फ्रंट से बैक या बैक से फ्रंट
                currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                
                try {
                    // नया कैमरा चालू करना
                    const newStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: currentFacingMode } },
                        audio: false // ऑडियो को डिस्टर्ब न करें
                    });
                    
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    
                    // सामने वाले दोस्त की स्क्रीन पर भी वीडियो पलट देना
                    if (window.activeWebRTC26) {
                        const sender = window.activeWebRTC26.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newVideoTrack);
                    }
                    
                    // अपनी स्क्रीन पर वीडियो पलटना
                    const oldStream = localVid.srcObject;
                    const oldVideoTrack = oldStream.getVideoTracks()[0];
                    oldStream.removeTrack(oldVideoTrack);
                    oldVideoTrack.stop(); // पुराना कैमरा बंद करें
                    
                    oldStream.addTrack(newVideoTrack);
                    localVid.srcObject = oldStream;
                    
                } catch (err) {
                    alert("Could not switch camera. Hardware locked.");
                }
            };
        }
    }, 5500); // 5.5s delay ताकि पुराने सारे पार्ट लोड हो जाएं, फिर यह अपना काम करे
</script>

    const backgroundWorkerCode = `

        self.addEventListener('notificationclick', function(event) {
            event.notification.close();
            event.waitUntil(
                clients.matchAll({ type: 'window' }).then(windowClients => {
                    if (windowClients.length > 0) {
                        windowClients[0].focus();
                    } else {
                        clients.openWindow('/');
                    }
                })
            );
        });
    `;

    const blob = new Blob([backgroundWorkerCode], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);

    if ('serviceWorker' in navigator) {

            // 3. पार्ट 38 वाले फंक्शन को अपग्रेड करना ताकि वो बैकग्राउंड में भी काम करे

  <script type="module">

    // यह कोड कैमरा और माइक चालू होने से पहले उन्हें हाई-क्वालिटी और बिना शोर वाला बना देगा
    const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function(constraints) {
        if (constraints.audio) {
            constraints.audio = {
                echoCancellation: true, // गूंज और खड़खड़ की आवाज़ खत्म करेगा
                noiseSuppression: true,
                autoGainControl: true
            };
        }
        if (constraints.video) {
            constraints.video = {
                width: { ideal: 1280 }, // HD वीडियो
                height: { ideal: 720 },
                facingMode: "user"
            };
        }
        return originalGetUserMedia(constraints);
    };

                    remoteVid.style.cssText = "position: absolute; width: 120px; height: 160px; bottom: 120px; right: 20px; z-index: 99; border-radius: 12px; object-fit: cover; border: 2px solid white;";
                } else {
                    remoteVid.style.cssText = "position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; object-fit: cover;";
                    localVid.style.cssText = "position: absolute; width: 120px; height: 160px; bottom: 120px; right: 20px; z-index: 99; border-radius: 12px; object-fit: cover; border: 2px solid white;";
                }
            };
        }
    }, 1000);
