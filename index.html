<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App - Wallpapers & Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* === बेसिक स्टाइलिंग === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f2f5; }
        .page { display: none; min-height: 100vh; }
        .active-page { display: block; }
        
        /* === टॉप नेविगेशन बार === */
        .navbar { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .menu-btn { cursor: pointer; font-size: 20px; }
        .dropdown { display: none; position: absolute; right: 10px; top: 50px; background: white; color: black; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
        .dropdown.show { display: block; }
        .dropdown-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #eee; }
        .dropdown-item:hover { background: #f1f1f1; }

        /* === 24 वॉलपेपर ग्रिड === */
        #wallpaper-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .wall-img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 5px; }
        
        /* फुल स्क्रीन इमेज मोडल */
        #img-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        #img-modal img { max-width: 95%; max-height: 95%; border-radius: 10px; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }

        /* === डैशबोर्ड (प्रोफ़ाइल पेज) === */
        .dashboard-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .profile-sec { display: flex; align-items: center; gap: 15px; background: white; padding: 15px; border-radius: 10px; }
        .profile-dp { width: 70px; height: 70px; border-radius: 50%; background: #ccc; overflow: hidden; position: relative; cursor: pointer; }
        .profile-dp img { width: 100%; height: 100%; }
        .dp-overlay { position: absolute; bottom: 0; background: rgba(0,0,0,0.5); color: white; width: 100%; text-align: center; font-size: 10px; padding: 2px 0; }
        .user-info h3 { margin-bottom: 5px; }
        .lock-note { font-size: 12px; color: red; }
        .search-bar { display: flex; padding: 10px; background: white; border-radius: 20px; align-items: center; }
        .search-bar input { border: none; outline: none; width: 100%; padding-left: 10px; }
        .nav-btn { background: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }

        /* === मेंबर्स लिस्ट पेज === */
        .member-list { padding: 15px; }
        .member-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .member-info { display: flex; align-items: center; gap: 10px; }
        .member-dp { width: 45px; height: 45px; border-radius: 50%; background: #ddd; }
        .add-btn { background: #128c7e; color: white; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; }

        /* === प्राइवेट मैसेंजर (WhatsApp Style) === */
        .chat-header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 10px; }
        .chat-icons i { margin-left: 15px; cursor: pointer; font-size: 18px; }
        
        .chat-area { height: calc(100vh - 130px); background: #e5ddd5; padding: 15px; overflow-y: scroll; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; }
        .msg-sent { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .msg-rcv { background: white; align-self: flex-start; border-top-left-radius: 0; }
        
        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 5px; font-size: 10px; color: #666; margin-top: 4px; }
        
        /* Message Ticks */
        .tick-single { color: #888; }
        .tick-double { color: #888; letter-spacing: -3px; }
        .tick-green { color: #34b7f1; letter-spacing: -3px; } /* WhatsApp uses blue, but let's call the class green/blue */

        /* Input Area & Colorful Rotated Send Button */
        .chat-input { display: flex; padding: 10px; background: white; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; }
        .chat-input i { font-size: 20px; color: #888; cursor: pointer; }
        .chat-input input { flex: 1; border: none; outline: none; background: #f0f0f0; padding: 12px; border-radius: 20px; }
        
        .send-btn { 
            background: linear-gradient(45deg, #ff0055, #007bff); 
            color: white; 
            border: none; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer;
            transform: rotate(-15deg); /* Rotated button as requested */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .send-btn:active { transform: rotate(0deg) scale(0.9); }
    </style>
</head>
<body>

    <!-- === टॉप नेविगेशन === -->
    <div class="navbar">
        <h2>My App</h2>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-ellipsis-v"></i></div>
        <div class="dropdown" id="menuDropdown">
            <div class="dropdown-item" onclick="loginWithGoogle()"><i class="fab fa-google text-danger"></i> Login with Google</div>
        </div>
    </div>

    <!-- === 1. वॉलपेपर पेज (होम पेज) === -->
    <div id="page-wallpapers" class="page active-page">
        <div id="wallpaper-grid">
            <!-- JS द्वारा 24 वॉलपेपर यहाँ जुड़ेंगे -->
        </div>
    </div>

    <!-- फुल स्क्रीन इमेज मोडल -->
    <div id="img-modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img id="full-img" src="" alt="Full Screen">
    </div>

    <!-- === 2. डैशबोर्ड पेज === -->
    <div id="page-dashboard" class="page">
        <div class="dashboard-container">
            <div class="profile-sec">
                <div class="profile-dp">
                    <img src="https://via.placeholder.com/70" alt="DP" id="user-dp">
                    <div class="dp-overlay">Change DP</div>
                </div>
                <div class="user-info">
                    <h3 id="username-display">Himanshu_8938</h3>
                    <p class="lock-note">Username locked for 14 days</p>
                </div>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search friends or features...">
            </div>

            <button class="nav-btn" onclick="showPage('page-members')"><i class="fas fa-users"></i> Go to Member List</button>
            <button class="nav-btn" onclick="showPage('page-chat')" style="background:#128c7e;"><i class="fas fa-comment-secret"></i> Open Secret Chat</button>
        </div>
    </div>

    <!-- === 3. मेंबर्स लिस्ट पेज === -->
    <div id="page-members" class="page">
        <div class="navbar" style="position: relative; padding: 10px; top: auto;">
            <i class="fas fa-arrow-left" onclick="showPage('page-dashboard')" style="cursor: pointer;"></i>
            <h3 style="flex:1; margin-left: 15px;">New Members List</h3>
        </div>
        <div class="member-list" id="member-list-container">
            <!-- Members will load here -->
        </div>
    </div>

    <!-- === 4. प्राइवेट मैसेंजर === -->
    <div id="page-chat" class="page">
        <div class="chat-header">
            <div class="chat-header-info">
                <i class="fas fa-arrow-left" onclick="showPage('page-dashboard')" style="cursor:pointer;"></i>
                <img src="https://via.placeholder.com/40" style="width: 40px; border-radius: 50%; margin-left:10px;">
                <div>
                    <h4 style="margin:0;">Lalit Bariya</h4>
                    <small>Online</small>
                </div>
            </div>
            <div class="chat-icons">
                <i class="fas fa-video"></i>
                <i class="fas fa-phone"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <div class="chat-area" id="chat-box">
            <!-- Chat Messages -->
            <div class="msg msg-rcv">
                Hi, how are you?
                <div class="msg-footer">10:00 AM</div>
            </div>
        </div>

        <div class="chat-input">
            <i class="fas fa-plus"></i> <!-- Secret Notification/Attach feature icon -->
            <i class="fas fa-image"></i> <!-- Gallery Icon -->
            <input type="text" id="msg-input" placeholder="Message...">
            <!-- कलरफुल और रोटेटेड सेंड बटन -->
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // 1. 24 वॉलपेपर लोड करना
        const grid = document.getElementById('wallpaper-grid');
        for(let i=1; i<=24; i++) {
            // डमी इमेजेज का इस्तेमाल किया गया है
            let img = document.createElement('img');
            img.src = `https://picsum.photos/300/400?random=${i}`;
            img.className = 'wall-img';
            img.onclick = () => openModal(img.src);
            grid.appendChild(img);
        }

        // फुल स्क्रीन मोडल लॉजिक
        const modal = document.getElementById('img-modal');
        const fullImg = document.getElementById('full-img');
        function openModal(src) { fullImg.src = src; modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }

        // 2. मेनू और नेविगेशन
        function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('show'); }
        
        function loginWithGoogle() {
            alert("Google Login Successful!");
            document.getElementById('menuDropdown').classList.remove('show');
            document.querySelector('.navbar').style.display = 'none'; // वॉलपेपर वाला नेवबार छिपाएं
            showPage('page-dashboard');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
        }

        // 3. मेंबर्स लिस्ट लोड करना
        const members = ['Vinit', 'Vansh', 'Shantanu', 'Kuldeep', 'Anuj', 'Deepanshu', 'Harsh Gill', 'Lucky', 'Abhijeet', 'Harshpal'];
        const memberContainer = document.getElementById('member-list-container');
        members.forEach(name => {
            memberContainer.innerHTML += `
                <div class="member-item">
                    <div class="member-info">
                        <img src="https://via.placeholder.com/45" class="member-dp">
                        <strong>${name}</strong>
                    </div>
                    <button class="add-btn">Add</button>
                </div>
            `;
        });

        // 4. WhatsApp जैसा चैट टिक सिस्टम और लाइव टाइम
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msgText = input.value.trim();
            if(!msgText) return;

            const chatBox = document.getElementById('chat-box');
            const now = new Date();
            const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');

            // मैसेज स्ट्रक्चर (शुरुआत में सिंगल टिक)
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg msg-sent';
            msgDiv.innerHTML = `
                ${msgText}
                <div class="msg-footer">
                    <span>${timeStr}</span>
                    <span class="tick tick-single"><i class="fas fa-check"></i></span>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // टिक बदलने का लॉजिक (Simulating network delays)
            const tickSpan = msgDiv.querySelector('.tick');
            
            // 2 सेकंड बाद डबल टिक (Notification Delivered)
            setTimeout(() => {
                tickSpan.className = 'tick tick-double';
                tickSpan.innerHTML = '<i class="fas fa-check-double"></i>';
            }, 2000);

            // 4 सेकंड बाद ग्रीन/ब्लू टिक (Message Seen)
            setTimeout(() => {
                tickSpan.className = 'tick tick-green';
                tickSpan.innerHTML = '<i class="fas fa-check-double"></i>';
                tickSpan.style.color = '#34b7f1'; // WhatsApp blue/green
            }, 4000);
        }
    </script>
</body>
</html>
