        /* =========================================
           GLOBAL CSS
           ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f0f0; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* =========================================
           FEATURE 9: SECRET NOTIFICATIONS
           ========================================= */
        #stealth-notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: white; padding: 12px 25px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: top 0.4s ease-in-out;
            z-index: 9999; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 10px;

           FEATURE 1: HOME PAGE (DISGUISE)
           ========================================= */
        #home-page { padding: 10px; background: #fff; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 15px; font-size: 20px; font-weight: bold; align-items: center; }
        .three-dots { cursor: pointer; padding: 5px 15px; font-size: 24px; font-weight: bold; }
        .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .wallpaper-item { width: 100%; height: 250px; background-color: #ddd; border-radius: 10px; background-size: cover; background-position: center; cursor: pointer; transition: 0.2s; }
        .wallpaper-item:active { transform: scale(0.96); }

        /* =========================================
           FEATURE 3, 4, 6: SECRET PAGE (PROFILE, SEARCH, ADD)
           ========================================= */
        #secret-page { background: #121212; color: white; min-height: 100vh; padding: 20px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        .new-friends-btn { background: #ff4757; color: white; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .profile-section { text-align: center; margin-bottom: 25px; }
        .profile-dp { width: 90px; height: 90px; border-radius: 50%; background: #444; margin: 0 auto 10px; border: 2px solid #4CAF50; cursor: pointer; object-fit: cover; }
        .username { font-size: 22px; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        .cooldown-text { font-size: 11px; color: #888; margin-bottom: 15px; }

        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; margin-bottom: 20px; background: #2a2a2a; color: white; font-size: 15px; }
        
        .section-title { font-size: 16px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 12px; border-radius: 12px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .dp-small { width: 45px; height: 45px; border-radius: 50%; background: #555; background-size: cover; }
        .add-btn { background: #4CAF50; color: white; border: none; padding: 6px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* =========================================
           FEATURE 6: INSTAGRAM STYLE FRIENDS LIST
           ========================================= */
        #friends-page { background: #000; color: white; min-height: 100vh; padding: 20px; }
        .my-name-header { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .dm-item { display: flex; align-items: center; gap: 15px; padding: 12px 0; cursor: pointer; }
        .dm-name { font-size: 16px; font-weight: bold; }

        /* =========================================
           FEATURE 7: PERSONAL CHAT PAGE
           ========================================= */
        #chat-page { display: flex; flex-direction: column; height: 100vh; background: #0b141a; color: white; }
        .chat-header { background: #202c33; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .call-buttons span { margin-left: 20px; font-size: 22px; cursor: pointer; }
        
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://i.ibb.co/3mN9f3R/bg.png'); background-size: cover; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 10px; position: relative; font-size: 15px; word-wrap: break-word; user-select: none; }
        .msg-received { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .msg-sent { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        
        .msg-info { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); }
        
        /* FEATURE 1: DOT SYSTEM */
        .dot-status { font-size: 12px; color: rgba(255,255,255,0.6); font-weight: bold; }

        /* FEATURE 11: SECURE MEDIA DOWNLOAD */

        .secure-img { width: 100%; border-radius: 8px; filter: blur(0px); /* Can add blur if needed */ }
        .manual-download-btn { display: block; text-align: center; background: rgba(0,0,0,0.7); color: white; padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 12px; cursor: pointer; font-weight: bold; border: 1px solid #555; }

        /* FEATURE 7: CUSTOM 3D GLOSSY SEND BUTTON */
        .chat-footer { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .media-icons { display: flex; gap: 12px; font-size: 22px; cursor: pointer; }
        .chat-input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; outline: none; background: #2a3942; color: white; font-size: 15px; }
        
        .custom-send-btn {
            width: 45px; height: 45px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #8e44ad, #f39c12, #2ecc71); /* Purple, Orange, Green */
            /* Arrow with Fish-tail/Y-Shape Back */
            clip-path: polygon(0 0, 100% 50%, 0 100%, 25% 50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: transform 0.1s; display: flex; align-items: center; justify-content: center;
        }
        .custom-send-btn:active { transform: scale(0.85); }
    </style>
</head>

            element.addEventListener('mouseup', endPress);
            element.addEventListener('mouseleave', endPress);
            element.addEventListener('touchstart', startPress);
            element.addEventListener('touchend', endPress);
        }
