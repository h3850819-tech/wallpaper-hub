        .back-btn { background: none; border: none; color: #00e6e6; font-size: 20px; cursor: pointer; }

        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #00e6e6; }

    <!-- UI Interactions Script (सारे 12 फीचर्स यहाँ काम करेंगे) -->
    <script>
        // मेनू और मोडल 
        document.getElementById('menuBtn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdownMenu').style.display = 'block'; });
        document.addEventListener('click', () => { document.getElementById('dropdownMenu').style.display = 'none'; });
        
        function openModal(id) { document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none'); document.getElementById('dropdownMenu').style.display = 'none'; document.getElementById(id).style.display = 'flex'; }
        function closeAllModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none'); }
        
        // वॉलपेपर फुल स्क्रीन
        function openFullscreen(src) { document.getElementById('full-img').src = src; document.getElementById('wallpaper-fullscreen-modal').style.display = 'flex'; }
        
        // गैलरी से DP बदलना
        function previewDP(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('myProfilePic').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        }

        // चैट नेविगेशन
        function openChat(name) {
            document.getElementById('messenger-home').style.display = 'none';
            document.getElementById('private-chat-room').style.display = 'flex';
            document.getElementById('chattingWithName').innerText = name;
        }
        function closePrivateChat() {
            document.getElementById('private-chat-room').style.display = 'none';
            document.getElementById('messenger-home').style.display = 'block';
        }

        // --- मैसेंजर के धांसू फीचर्स --- //
        
        // सीक्रेट नोटिफिकेशन
        let notifTimer;
        function showSecretNotif(text) {
            const notif = document.getElementById('secret-notif');
            notif.innerText = text;
            notif.style.display = 'block';
            clearTimeout(notifTimer);
            notifTimer = setTimeout(() => notif.style.display = 'none', 2000);
        }
        function triggerTyping() { showSecretNotif("New Wallpaper Typing..."); }

        // ट्रांसलेट फीचर (Mock)
        function translateHindiToEnglish() {
            const input = document.getElementById('messageInput');
            if(input.value.trim() !== "") { input.value = "[Translated]: " + input.value; }
        }

        // कॉलिंग 
        function startCall() { document.getElementById('callingName').innerText = document.getElementById('chattingWithName').innerText; document.getElementById('call-screen').style.display = 'flex'; }
        function endCall() { document.getElementById('call-screen').style.display = 'none'; }

        // मैसेज भेजना, डिलीट करना और टिक सिस्टम (✓, ✓✓, Green ✓✓)
        function sendCustomMessage() {
            const input = document.getElementById('messageInput');
            let text = input.value.trim();
            if(!text) return;
            
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message outgoing';
            
            // Delete Message Feature (डबल क्लिक पर)
            msgDiv.ondblclick = function() {
                if(confirm("Delete for everyone?")) {
                    this.innerHTML = "<i style='color:#555;'>🚫 This message was deleted</i>";
                    this.style.background = "transparent"; this.style.border = "1px solid #3b3b54";
                }
            };

            msgDiv.innerHTML = `${text} <div class="msg-info"><span>${timeStr}</span> <span class="tick">✓</span></div>`;
            document.getElementById('chatMessages').appendChild(msgDiv);
            input.value = '';
            showSecretNotif("New Wallpaper"); // मैसेज जाने पर नोटिफिकेशन

            // टिक बदलने का जादू
            const tickSpan = msgDiv.querySelector('.tick');
            setTimeout(() => { tickSpan.innerText = '✓✓'; }, 1500); // 1.5s बाद डिलीवर
            setTimeout(() => { tickSpan.classList.add('tick-green'); }, 3500); // 3.5s बाद सीन (Green/White theme sync)
        }
    </script>

        .chat-header { background-color: #161622; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b2b40; position: sticky; top: 0; z-index: 10; }

        /* 5 से 10. प्राइवेट चैट रूम */
        #private-chat-room { display: none; flex-direction: column; height: 100vh; background-color: #0f0f15; }
        .chat-room-header { background-color: #161622; padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #2b2b40; }
        .back-btn { background: none; border: none; color: #00e6e6; font-size: 20px; cursor: pointer; }
        .header-icons { margin-left: auto; display: flex; gap: 15px; color: #00e6e6; font-size: 18px; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; cursor: pointer; }
        .message.incoming { background-color: #1e1e2f; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.outgoing { background: linear-gradient(45deg, #2b5876, #4e4376); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .msg-info { font-size: 10px; color: #ccc; display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 4px; }
        .tick { font-size: 12px; color: #aaa; }
        .tick-green { color: #00e6e6; text-shadow: 0 0 2px #00e6e6; } /* WhatsApp Blue/Green Tick Effect */

        /* चैट इनपुट और 7. आपका नया सेंड बटन */
        .chat-input-area { padding: 10px; background-color: #161622; display: flex; gap: 10px; align-items: center; border-top: 1px solid #2b2b40; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #1e1e2f; border: 1px solid #3b3b54; border-radius: 20px; color: white; outline: none; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #aaa; transition: 0.2s; }
        .icon-btn:hover { color: #00e6e6; }
        
        /* Your Custom Send Button */
        .send-btn-img { background: transparent; border: none; width: 45px; height: 45px; cursor: pointer; padding: 0; display: flex; justify-content: center; align-items: center; transition: 0.2s; transform: rotate(-10deg); }
        .send-btn-img img { width: 100%; height: 100%; object-fit: contain; }
        .send-btn-img:active { transform: scale(0.9) rotate(0deg); }

        /* 11. सीक्रेट नोटिफिकेशन */
        #secret-notif { display: none; position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #161622; color: #00e6e6; padding: 10px 25px; border-radius: 30px; font-weight: bold; font-size: 14px; z-index: 9999; box-shadow: 0 4px 15px rgba(0,230,230,0.2); border: 1px solid #00e6e6; }

        /* 12. कॉलिंग स्क्रीन (Instagram Style) */
        #call-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f15; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }

        .call-btn { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 24px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; }
