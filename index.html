<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Wallpaper Hub & Secure Messenger</title>
    <style>
        /* --- Core & Theme Styles --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f15; color: #ffffff; padding-bottom: 70px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #161622; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        header h1 { font-size: 20px; color: #ff3366; letter-spacing: 1px; }
        .menu-container { position: relative; }
        .three-dot-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px 10px; z-index: 1001; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 50px; background-color: #1e1e2f; border-radius: 8px; min-width: 170px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); overflow: hidden; z-index: 1000; }
        .dropdown-menu button { width: 100%; background: none; border: none; color: white; padding: 12px 15px; text-align: left; font-size: 14px; cursor: pointer; }
        .dropdown-menu button:hover { background-color: #2b2b40; }
        
        .category-container { margin: 20px 15px; }
        .category-title { font-size: 18px; color: #00e6e6; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .wallpaper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .wallpaper-card { background-color: #161622; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: transform 0.2s; cursor: pointer; }
        .wallpaper-card:hover { transform: scale(1.03); }
        .wallpaper-card img { width: 100%; height: 180px; object-fit: cover; display: block; }

        /* --- Full Screen Wallpaper Modal Viewer --- */
        #wallpaperViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        #wallpaperViewer img { max-width: 90%; max-height: 80%; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.8); }
        .close-viewer { margin-top: 20px; background: #ff3366; color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        /* --- Auth Modal Style --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background-color: #1e1e2f; padding: 30px 25px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #2b2b40; }
        .auth-box h2 { font-size: 22px; margin-bottom: 10px; color: #ff3366; }
        .auth-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff3366, #ff6633); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .google-btn { background: #4285F4; margin-top: 15px; box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4); }
        .close-btn { background: none; border: none; color: #aaa; margin-top: 15px; cursor: pointer; font-size: 14px; }
        
        /* --- Messenger Dashboard Style (Screens 2 & 3) --- */
        #chat-dashboard { display: none; max-width: 500px; margin: 0 auto; min-height: 100vh; flex-direction: column; background-color: #0f0f15; border-left: 1px solid #2b2b40; border-right: 1px solid #2b2b40; position: relative;}
        .chat-header { background-color: #161622; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b2b40; position: sticky; top: 0; z-index: 10; }
        .chat-header h2 { font-size: 18px; color: #00e6e6; display: flex; align-items: center; gap: 10px; }
        
        .profile-section { text-align: center; padding: 25px 20px 15px; }
        .profile-pic { width: 90px; height: 90px; background-color: #1e1e2f; border-radius: 50%; margin: 0 auto 15px; display: block; object-fit: cover; border: 2px solid #ff3366; }
        .change-dp-btn { background-color: #1e1e2f; color: #00e6e6; border: 1px solid #3b3b54; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .username-display { margin-top: 15px; font-size: 16px; font-weight: bold; color: #fff; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .username-display input { background: #11111a; border: 1px solid #3b3b54; border-radius: 6px; padding: 8px 10px; color: #00e6e6; font-size: 15px; font-weight: bold; text-align: center; width: 150px; outline: none; }
        #saveUserBtn { background: #00e6e6; color: #0f0f15; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        
        .search-container { padding: 0 20px 20px; }
        .search-bar { width: 100%; padding: 12px 15px; border: 1px solid #3b3b54; border-radius: 12px; background-color: #1e1e2f; color: white; font-size: 15px; outline: none; }

        .list-section { padding: 0 20px 20px; }
        .section-title-chat { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #2b2b40; padding-bottom: 5px;}
        
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e1e2f; }
        .user-info { display: flex; align-items: center; cursor: pointer; flex: 1; }
        .user-avatar { width: 45px; height: 45px; background-color: #3b3b54; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .user-details p { margin: 0; }
        .user-name { font-weight: bold; font-size: 15px; color: #fff; }
        .user-status { font-size: 12px; color: #888; margin-top: 3px; }

        .btn-add { background-color: #00e6e6; color: #0f0f15; border: none; padding: 7px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-add.requested { background-color: #1e1e2f; color: #00e6e6; border: 1px solid #00e6e6; cursor: default; }
        .btn-accept { background-color: #ff3366; color: #fff; border: none; padding: 7px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* --- Bottom Navigation Bar --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background-color: #161622; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #2b2b40; z-index: 100; }
        .nav-item { background: none; border: none; color: #888; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #00e6e6; }

        /* --- Private Chat Room (Screen 4) --- */
        #private-chat-room { display: none; flex-direction: column; height: 100vh; background-color: #0f0f15; }
        .chat-room-header { background-color: #161622; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2b2b40; }
        .chat-room-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: none; border: none; color: #00e6e6; font-size: 20px; cursor: pointer; }
        .call-icons { display: flex; gap: 15px; font-size: 20px; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .message.incoming { background-color: #1e1e2f; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.outgoing { background: linear-gradient(45deg, #00e6e6, #00b3b3); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-time { font-size: 10px; margin-top: 4px; text-align: right; opacity: 0.7; }
        
        .chat-input-area { padding: 12px 15px; background-color: #161622; display: flex; align-items: center; gap: 10px; border-top: 1px solid #2b2b40; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #1e1e2f; border: 1px solid #3b3b54; border-radius: 20px; color: white; outline: none; }
        .action-icon-btn { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; }
        .send-btn { width: 42px; height: 42px; background-color: #ff3366; border: none; border-radius: 50%; color: white; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; transform: rotate(45deg); }

        /* --- Calling Screen (Screen 5) --- */
        #calling-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f15; z-index: 3000; flex-direction: column; justify-content: space-between; padding: 30px 20px; text-align: center; }
        .call-top-bar { display: flex; justify-content: space-between; align-items: center; }
        .call-center-info { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .call-dp { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ff3366; object-fit: cover; }
        .call-controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .call-btn { width: 55px; height: 55px; border-radius: 50%; border: none; background: #1e1e2f; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .call-btn.end-call { background: #ff3366; width: 65px; height: 65px; }
    </style>
</head>
<body>

    <!-- SCREEN 1: Wallpaper Hub Front Page -->
    <div id="main-website">
        <header>
            <h1>🌟 Premium Wallpapers</h1>
            <div class="menu-container">
                <button class="three-dot-btn" id="menuBtn">⋮</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button onclick="openModal('loginModal')">🔒 Private Chat Login</button>
                    <button onclick="openModal('registerModal')">📝 Create Account</button>
                </div>
            </div>
        </header>

        <!-- 24 Wallpapers Grid Collection -->
        <div class="category-container">
            <div class="category-title">🏎️ Supercars & Bikes</div>
            <div class="wallpaper-grid" id="wallpaperGrid">
                <!-- Wallpapers will be injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Full Screen Wallpaper Viewer Modal -->
    <div id="wallpaperViewer">
        <img id="viewerImg" src="" alt="Wallpaper">
        <button class="close-viewer" onclick="closeViewer()">Close</button>
    </div>

    <!-- Auth Modals -->
    <div class="modal-overlay" id="loginModal">
        <div class="auth-box">
            <h2>Secure Login</h2>
            <button class="auth-btn google-btn" id="googleLoginBtn1">🌐 Continue with Google</button>
            <button class="close-btn" onclick="closeAllModals()">Cancel</button>
        </div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="auth-box">
            <h2>Create Account</h2>
            <button class="auth-btn google-btn" id="googleLoginBtn2">🌐 Register with Google</button>
            <button class="close-btn" onclick="closeAllModals()">Cancel</button>
        </div>
    </div>

    <!-- MESSENGER DASHBOARD (Screens 2 & 3) -->
    <div id="chat-dashboard">
        
        <!-- HOME / MEMBERS SECTION (Screen 2) -->
        <div id="messenger-home">
            <div class="chat-header">
                <h2>Private Messenger</h2>
                <button class="close-btn" id="logoutBtn" style="margin:0; color:#ff3366; font-weight:bold;">Logout</button>
            </div>
            
            <div class="profile-section">
                <img src="https://via.placeholder.com/100" class="profile-pic" id="myProfilePic">
                <button class="change-dp-btn" id="changeDpBtn">📷 Change DP</button>
                <div class="username-display">
                    <span>ID:</span> 
                    <input type="text" placeholder="Username" id="myUsername" maxlength="15"> 
                    <button id="saveUserBtn">Save</button>
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-bar" id="searchUserBar" placeholder="🔍 Search member name...">
            </div>

            <div class="list-section" id="search-results-section" style="display: none;">
                <div class="section-title-chat">Search Results</div>
                <div id="search-results-list"></div>
            </div>

            <div class="list-section" id="requests-received-section" style="display: none;">
                <div class="section-title-chat">Friend Requests</div>
                <div id="requests-received-list"></div>
            </div>

            <!-- CHAT LIST SECTION (Screen 3) -->
            <div class="list-section">
                <div class="section-title-chat">Active Chats</div>
                <div id="friends-list"></div>
            </div>
        </div>

        <!-- PRIVATE CHAT ROOM (Screen 4) -->
        <div id="private-chat-room">
            <div class="chat-room-header">
                <div class="chat-room-header-left">
                    <button class="back-btn" onclick="closePrivateChat()">←</button>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="https://via.placeholder.com/35" id="chatHeaderPic" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                        <div>
                            <h3 style="font-size: 15px; color: white;" id="chattingWithName">Friend</h3>
                            <p style="font-size: 10px; color: #00e6e6;" id="chatStatus">Online</p>
                        </div>
                    </div>
                </div>
                <div class="call-icons">
                    <span onclick="startCall('audio')">📞</span>
                    <span onclick="startCall('video')">📹</span>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-area">
                <button class="action-icon-btn" onclick="sendVoiceNote()">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button class="action-icon-btn" onclick="triggerAttachment()">📎</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchNav('home')"><span>🏠</span> Home</button>
            <button class="nav-item" onclick="switchNav('chats')"><span>💬</span> Chats</button>
            <button class="nav-item" onclick="switchNav('profile')"><span>👤</span> Profile</button>
        </div>
    </div>

    <!-- CALLING SCREEN (Screen 5) -->
    <div id="calling-screen">
        <div class="call-top-bar">
            <button class="close-btn" onclick="minimizeCall()">🗕 Minimize</button>
            <button class="close-btn" onclick="flipCamera()">🔄 Flip Camera</button>
        </div>
        <div class="call-center-info">
            <img src="https://via.placeholder.com/120" id="callTargetPic" class="call-dp">
            <div>
                <h2 id="callTargetName" style="font-size:22px; color:white;">Friend Name</h2>
                <p id="callTimer" style="font-size:14px; color:#00e6e6; margin-top:5px;">Connecting...</p>
            </div>
        </div>
        <div class="call-controls">
            <button class="call-btn" onclick="alert('Conference Call feature active')">➕</button>
            <button class="call-btn" onclick="toggleSpeaker()">🔊</button>
            <button class="call-btn" onclick="toggleMute()">🎤</button>
            <button class="call-btn end-call" onclick="endCall()">🔴</button>
        </div>
    </div>
